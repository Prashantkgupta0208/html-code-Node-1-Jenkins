<!-- This Website is deployed on node 1 for demo -->
<!-- this repo does not have Jenkinsfile, but using from other Repository -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Website - Node 1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .badge {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .info-box {
            background-color: #e9ecef;
            border-left: 5px solid #0056b3;
            padding: 15px;
            text-align: left;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .info-box ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        .info-box li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Live Demo</div>
        <h1>Application Status</h1>
        <p>This website has been successfully deployed and is running live for demonstration purposes.</p>
        
        <div class="info-box">
            <strong>Deployment Metadata:</strong>
            <ul>
                <li><strong>Environment:</strong> Node 1</li>
                <li><strong>Pipeline:</strong> Remote Jenkinsfile (External Repository)</li>
            </ul>
        </div>
    </div>

</body>
</html>
